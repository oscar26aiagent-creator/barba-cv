name: "Schema change request"
description: Propose changes to Barba-CV schema structure or semantics.
title: "[SCHEMA] "
labels: ["schema", "enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What interoperability/problem does this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe fields, optionality, and compatibility impact.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example payload snippets
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility checklist
      options:
        - label: I described backward compatibility impact
        - label: I described migration path (if needed)
